# ---------------------------------------------------------------- параллельный запуск (JUnit 5/6)
# Классы идут параллельно, тесты ВНУТРИ класса — последовательно в одном потоке:
# в части классов общие static-контроллеры, списки для уборки и @AfterEach, который откатывает
# глобальные настройки (GamificationTest). Сами тесты друг от друга не зависят — @Order нигде нет.
# Число потоков можно переопределить: ./gradlew test -Pthreads=3, выключить: -Pthreads=1
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 5
# не больше 5 потоков, даже если какой-то поток ждёт (Wait.until, Thread.sleep)
junit.jupiter.execution.parallel.config.fixed.max-pool-size = 5
